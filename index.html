<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            color: #fff;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 450px;
            width: 90%;
            margin: 20px;
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-size: 2.2rem;
            color: #e94560;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #f1f1f1;
        }

        video {
            width: 100%;
            border-radius: 12px;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .balloon {
            position: absolute;
            width: 30px;
            height: 40px;
            background: #e94560;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            bottom: -100px;
            animation: float 6s ease-in infinite;
            z-index: -1;
        }

        .balloon:nth-child(2) { left: 20%; background: #0f3460; animation-delay: 1s; }
        .balloon:nth-child(3) { left: 50%; background: #533483; animation-delay: 3s; }
        .balloon:nth-child(4) { left: 75%; background: #e94560; animation-delay: 2s; }

        @keyframes float {
            0% { bottom: -100px; opacity: 1; }
            100% { bottom: 100vh; opacity: 0; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>

    <div class="card">
        <h1>🎂 Happy Birthday! 🎉</h1>
        <p>Wishing you a wonderful day filled with happiness & success!</p>
        
        <video controls autoplay loop muted playsinline>
            <source src="my-video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

</body>
</html>
